# ============================================================
# PHASE 3: COMPLETE PROBLEMATIC KEYWORD CONFIGURATION
# ============================================================
problematic_keyword_config:
  enabled: true
  min_context_radius: 10  # Words before/after to check for context
  require_full_word_matching: true
  
  # High-risk single-character keywords
  ar:
    enabled: true
    risk_level: high
    requires_context: true
    match_type: full_word_only
    context_required:
      - augmented_reality
      - architecture
      - arm_architecture
      - ar_development
    min_context_score: 3
    weight_penalty: -5
    alias_to: augmented_reality
    
  ai:
    enabled: true
