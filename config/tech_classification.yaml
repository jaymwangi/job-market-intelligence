  calibration_points:
    - score: 0
      confidence: 0.01
    - score: 2
      confidence: 0.08
    - score: 3
      confidence: 0.15
    - score: 5
      confidence: 0.30
    - score: 8
      confidence: 0.50
    - score: 10
      confidence: 0.65
    - score: 12
      confidence: 0.78
    - score: 15
      confidence: 0.88
    - score: 18
      confidence: 0.95
    - score: 20
      confidence: 0.98
  interpolation: linear

  # ============================================================
# VALIDATION - PHASE 3 COMPLETE
# ============================================================
validation:
  dataset_size: 500
  metrics:
    - precision
    - recall
    - f1
    - per_category_accuracy
    - confusion_matrix
    - false_positive_rate
  action: Validate v3.7.0 with expanded taxonomy, skill vocabulary, and context-aware matching
  expected_improvement:
    score_too_low_reduction: 60-70%
    false_positive_reduction: 40-50%
  problematic_keyword_monitoring:
    enabled: true
    report_ambiguous_matches: true
    track_false_positives: true
    keywords_to_monitor:
      - ar
      - ai
      - go
      - r
      - qa
      - api
      - iso
      - git
      - it
      - ui
      - ux
# ============================================================
# SUMMARY
# ============================================================
summary:
  evidence_weights: 'Title: 50% | Description: 25% | Skills: 20% | Company: 3% | Experience: 2%'
  category_weights: All categories now weight 1.0 - evidence alone determines winner
  title_taxonomy: Expanded from 2 strong patterns to 30+ strong patterns + 15 potential patterns
  skill_vocabulary: Expanded to 200+ terms across all domains
  negative_keywords: Reserved for occupations only (no tech-vs-tech penalties)
  deduplication: Enabled - each keyword counted once per evidence source
  confidence_calibration: Recalibrated with lower thresholds for better tech role detection
  classification_policy: Updated with expanded category support (network, systems, solutions, support, management)
  status: Ready for validation with expanded evidence extraction
  
  phases_completed:
    - phase: Phase 1 - Title Taxonomy Expansion
      details: 30+ strong patterns added
    - phase: Phase 2 - Skill Vocabulary Expansion
      details: 200+ terms added
    - phase: Phase 3 - Problematic Keyword Audit & Context-Aware Configuration
      details:
        problematic_keywords_configured: 11
        context_radius: 10
        risk_levels:
          high: ['ar', 'ai', 'go', 'r', 'it']
          medium: ['qa', 'api', 'iso', 'ui', 'ux']
          low: ['git']
        features:
          - Context-aware matching with 10-word radius
          - Context scoring with min_context_score thresholds
          - Phrase mappings for common tech terms
          - Weight penalties for ambiguous matches
          - Full word boundary matching for short keywords
  
  next_steps:
    - Run validation on 500-sample dataset
    - Monitor false positives (especially from problematic keywords)
    - Fine-tune context thresholds based on validation results
    - Deploy to production when validation shows improvement

