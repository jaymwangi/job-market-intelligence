# ============================================================
# WEIGHT CONFIGURATION
# ============================================================
weights:
  title: 0.50          # Increased from 0.45 to give more weight to clear titles
  description: 0.25    # Reduced from 0.30
  skills: 0.20
  company_industry: 0.03
  required_experience: 0.02

# ============================================================
# MATCHING CONFIGURATION
# ============================================================
matching:
  exact_weight: 1.0
  stemmed_weight: 0.8
  fuzzy_weight: 0.6
  regex_weight: 0.9
  deduplicate_keywords: true
  min_skill_length: 2    # NEW: Ignore single-character skills

# ============================================================
# THRESHOLDS - PHASE 1: Lowered for better recall
# ============================================================
thresholds:
