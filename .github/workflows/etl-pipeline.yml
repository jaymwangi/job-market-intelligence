name: Daily ETL Pipeline

on:
  schedule:
    - cron: '0 6 * * *'  # Daily at 6:00 AM UTC
  workflow_dispatch:

concurrency:
  group: daily-etl
  cancel-in-progress: false

jobs:
  run-etl:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
      ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
      ETL_TIMEOUT_MINUTES: ${{ secrets.ETL_TIMEOUT_MINUTES || '240' }}
      ENVIRONMENT: production
      LOG_LEVEL: INFO
      TRANSLATION_PROVIDER: deepl
      DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Python with cache
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run migrations
        run: alembic upgrade head
      
      - name: Validate production configuration
        run: |
          python -c "
          from config.settings import settings
          print('Environment:', settings.environment)
          print('Translation provider:', settings.translation_provider)
          print('DeepL configured:', bool(settings.deepl_api_key))
          print('Debug:', settings.debug)
          print('Production errors:', settings.validate_production())
          "

      - name: Run ETL pipeline
        run: python -m scripts.run_pipeline